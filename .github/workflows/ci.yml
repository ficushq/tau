name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - initiative/color-themes
      - ficus/rename
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Cancel a PR's superseded runs, and ONLY a PR's.
#
# Without this, every push to a branch started another full ~21 job-minute run
# and the previous one kept burning a runner to completion. Measured over four
# days: branches were accumulating 5-10 CI runs each and ~17% of pull_request
# runs were still in flight when their successor started.
#
# cancel-in-progress is deliberately conditional rather than a flat `true`. A
# run on main, in the merge queue, or from the nightly schedule is not
# superseded by anything — it is the record for that commit, and on main it is
# what deploy and the artifact build key off. Cancelling those would trade a
# CI bill for a hole in the history.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos-paths:
    name: Classify macOS portability paths
    runs-on: ubuntu-24.04
    outputs:
      run_macos: ${{ steps.classify.outputs.run_macos }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - id: classify
        name: Classify Darwin-relevant changes
        run: bun .github/macos-ci-gate.ts classify

  macos-portability-suite:
    name: macOS portability suite
    needs: macos-paths
    if: ${{ needs.macos-paths.result == 'success' && needs.macos-paths.outputs.run_macos == 'true' }}
    runs-on: macos-14
    # Native lifecycle and attachment checks run on a real Darwin host.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run native local launchd lifecycle
        working-directory: .github
        run: bun test native-local-supervisor-launchd.test.ts
      - name: Run real exe lobby subprocess lifecycle tests
        # Run from .github so ITS bunfig.toml is the one Bun loads — Bun reads
        # `bunfig.toml` from the cwd only, and does not walk up, so the root
        # bunfig's Core preloads (which need the ParadeDB container,
        # unavailable here) are skipped. This hermetic suite exercises real
        # /bin/sh + subprocess behavior on Darwin.
        run: bun test exe-lifecycle-config-probe.test.ts ../apps/core/src/services/machines/providers/exe-api-exec.test.ts
        working-directory: .github
      - name: Run portable attachment materialization tests
        # Exercise the real Darwin libc descriptor-relative syscalls. Running
        # from .github avoids Core's database preload, unavailable in this job.
        working-directory: .github
        run: |
          set -o pipefail
          bun test ../apps/core/src/services/attachments/materialize.test.ts ../apps/core/src/services/attachments/blob-storage.test.ts 2>&1 | tee /tmp/attachment-materialization-macos.log
          grep -E '^[[:space:]]*[0-9]+ (pass|fail|skip)' /tmp/attachment-materialization-macos.log >> "$GITHUB_STEP_SUMMARY"
          if grep -qE '^[[:space:]]*[1-9][0-9]* skip' /tmp/attachment-materialization-macos.log; then
            echo "Portable attachment materialization tests must not skip on macOS." >&2
            exit 1
          fi
  macos-portability-required:
    name: macOS portability
    needs: [macos-paths, macos-portability-suite]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Require requested Darwin coverage
        env:
          CLASSIFIER_RESULT: ${{ needs.macos-paths.result }}
          RUN_MACOS: ${{ needs.macos-paths.outputs.run_macos }}
          MACOS_RESULT: ${{ needs.macos-portability-suite.result }}
        run: bun .github/macos-ci-gate.ts verify-result

  test-gates:
    # Workflow + shell gates and the setup helper suites. No database: nothing here
    # touches Postgres, so a gate failure can no longer sit behind a six-minute core
    # suite (or hide one).
    name: test / gates
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          # History is used by changed-path and Git-backed test fixtures.
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in lockstep with .bun-version (enforced by
          # .github/bun-version-gate.test.ts). Bun 1.3.11 segfaults loading this
          # repo's test graph (exit 133, main-thread trap) before any test runs
          # — the AMTP node-conformance suite (apps/core/src/services/amtp/
          # node-conformance-readiness.test.ts) is the canary. Validate any bump
          # against that suite before moving the pin.
          bun-version: 1.4.2

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Warning: Failed to save: <h2>Our services aren't available right now</h2><p>We're working to restore all services as soon as possible. Please check back soon.</p>0IwKiaQAAAADjh/+FNX7BTYMVk1Vx8z1mQ0hHRURHRTE3MTYARWRnZQ==
      # Cache Docker images
      # - name: Cache Docker images
      #   uses: ScribeMD/docker-cache@0.5.0
      #   with:
      #     key: docker-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      # Start PostgreSQL container (allows caching the image)
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prove cross-user Node shim immunity
        run: sudo env "PATH=$PATH" bash scripts/setup/bun-node-cross-user.test.sh

      - name: Run setup helper suite
        run: |
          sudo env "PATH=$PATH" bash -c 'source scripts/setup/lib.sh; ensure_yq'
          set -o pipefail
          status=0
          out=$(bash scripts/setup/lib.test.sh 2>&1) || status=$?
          printf '%s\n' "${out}"
          # Gate on the summary line itself, not just the exit code: a set -e
          # abort mid-suite exits WITHOUT printing "N passed, 0 failed", and an
          # exit-code mask must not be able to turn that green. Never mask
          # platform failures — no || true anywhere.
          tail -n 1 <<<"${out}" | grep -Eq '^[0-9]+ passed, 0 failed$' || {
            echo '::error::lib.test.sh ended without a clean "N passed, 0 failed" summary.'
            exit 1
          }
          if (( status != 0 )); then exit $(( status )); fi

      # The suite above runs unprivileged, so its root-install sections
      # (ensure_system_bun_node, ensure_swapfile — `install -o root -g root`)
      # self-skip via the capability probe and those ~30 assertions have
      # NEVER executed anywhere. Run the same suite as root so they do; expect
      # real failures to surface here and fix them honestly, never mask them.
      - name: Run setup helper suite (root install)
        run: |
          set -o pipefail
          status=0
          out=$(sudo env "PATH=$PATH" bash scripts/setup/lib.test.sh 2>&1) || status=$?
          printf '%s\n' "${out}"
          # Same summary-line gate as the unprivileged run: a set -e abort
          # mid-suite exits without printing it, and must be red even if the
          # exit code were ever masked. Never mask platform failures.
          tail -n 1 <<<"${out}" | grep -Eq '^[0-9]+ passed, 0 failed$' || {
            echo '::error::lib.test.sh (root) ended without a clean "N passed, 0 failed" summary.'
            exit 1
          }
          # POSITIVE execution gate: the whole point of running under sudo is
          # that the root-install sections actually execute. lib.test.sh
          # prints the marker line only when its capability probe passed, so a
          # run where they self-skipped again — for any reason — fails here
          # even with a green summary. Positive on purpose: gating on the
          # absence of a skip warning would silently break when the warning
          # is ever reworded; the marker is a contract.
          grep -Fq 'TAU root-install sections: ENABLED' <<<"${out}" || {
            echo '::error::lib.test.sh (root) skipped the root-install sections (no "TAU root-install sections: ENABLED" marker) — this step exists to execute them.'
            exit 1
          }
          if (( status != 0 )); then exit $(( status )); fi

      # retarget-origin.sh's mutation phase (steps 1-6) needs real root — its
      # own EUID check has no sudo fallback — so retarget-origin.test.sh's
      # mutation-phase section self-skips unless the WHOLE test process is
      # root, same as lib.test.sh's root-install sections above. The test
      # file PATH-shims sudo/systemctl/caddy/id/curl/journalctl and creates a
      # throwaway system caddy user itself (install_origin_cert's chown
      # target), so this step needs nothing beyond root + yq (already on
      # PATH from the ensure_yq call above). Same summary-line + positive-
      # marker gating as lib.test.sh (root install).
      - name: Run retarget-origin mutation-phase suite (root)
        run: |
          set -o pipefail
          status=0
          out=$(sudo env "PATH=$PATH" bash scripts/setup/retarget-origin.test.sh 2>&1) || status=$?
          printf '%s\n' "${out}"
          tail -n 1 <<<"${out}" | grep -Eq '^[0-9]+ passed, 0 failed$' || {
            echo '::error::retarget-origin.test.sh (root) ended without a clean "N passed, 0 failed" summary.'
            exit 1
          }
          # POSITIVE execution gate, same reasoning as lib.test.sh's marker
          # above: a green summary alone cannot distinguish "the mutation
          # phase ran" from "it self-skipped again for some new reason".
          grep -Fq 'TAU retarget-origin mutation-phase section: ENABLED' <<<"${out}" || {
            echo '::error::retarget-origin.test.sh (root) skipped the mutation-phase section (no "TAU retarget-origin mutation-phase section: ENABLED" marker) — this step exists to execute it.'
            exit 1
          }
          if (( status != 0 )); then exit $(( status )); fi

      # Same shape for retarget-backup.sh: its real run (and the failure
      # injection around it) needs real root — no sudo fallback — so the
      # mutation-phase section self-skips unless the whole test process is
      # root. The test PATH-shims curl/systemctl and the file tools it injects
      # failures into, and points the backup paths at a scratch directory, so
      # this step needs nothing beyond root + yq (already on PATH above).
      - name: Run retarget-backup mutation-phase suite (root)
        run: |
          set -o pipefail
          status=0
          out=$(sudo env "PATH=$PATH" bash scripts/setup/retarget-backup.test.sh 2>&1) || status=$?
          printf '%s\n' "${out}"
          tail -n 1 <<<"${out}" | grep -Eq '^[0-9]+ passed, 0 failed$' || {
            echo '::error::retarget-backup.test.sh (root) ended without a clean "N passed, 0 failed" summary.'
            exit 1
          }
          grep -Fq 'TAU retarget-backup mutation-phase section: ENABLED' <<<"${out}" || {
            echo '::error::retarget-backup.test.sh (root) skipped the mutation-phase section (no "TAU retarget-backup mutation-phase section: ENABLED" marker) — this step exists to execute it.'
            exit 1
          }
          if (( status != 0 )); then exit $(( status )); fi

      # The Ficus env rename (TAU_* -> FICUS_*) end to end: upgrade-host.sh,
      # apply-artifacts.sh and setup-host.sh run as root against a fake host
      # (every path through the toolkit's seams; systemctl, journalctl,
      # swapon, sleep and the health probe are PATH shims) — the rename, the
      # rollback restore, SIGTERM/SIGHUP/SIGKILL, the reconcile and the
      # refusals. It needs real root and a systemd Ubuntu host, so the same
      # summary-line + positive-marker gating as the suites above.
      - name: Run env-prefix upgrade suite (root)
        run: |
          set -o pipefail
          status=0
          out=$(sudo env "PATH=$PATH" bash scripts/setup/env-prefix-upgrade.test.sh 2>&1) || status=$?
          printf '%s\n' "${out}"
          tail -n 1 <<<"${out}" | grep -Eq '^[0-9]+ passed, 0 failed$' || {
            echo '::error::env-prefix-upgrade.test.sh (root) ended without a clean "N passed, 0 failed" summary.'
            exit 1
          }
          grep -Fq 'FICUS env-prefix upgrade section: ENABLED' <<<"${out}" || {
            echo '::error::env-prefix-upgrade.test.sh (root) skipped itself (no "FICUS env-prefix upgrade section: ENABLED" marker) — this step exists to execute it.'
            exit 1
          }
          if (( status != 0 )); then exit $(( status )); fi

      # Cache downloaded packages only. Installed module trees are worktree/layout-specific.
      - name: Verify deterministic Pi patch regeneration has no drift
        run: |
          git clone --quiet https://github.com/earendil-works/pi.git "$RUNNER_TEMP/pi-mono"
          git -C "$RUNNER_TEMP/pi-mono" checkout --quiet --detach f07218c4d4bbc12bef056a7058c3dd49dfe41abe
          PI_MONO_DIR="$RUNNER_TEMP/pi-mono" bash scripts/regenerate-pi-coding-agent-patch.sh

      - name: Validate macOS portability gate
        run: bun test ./macos-ci-gate.test.ts
        working-directory: .github

      - name: Validate setup helper CI gate
        run: bun test ./setup-shell-ci-gate.test.ts
        working-directory: .github

      - name: Validate CLI publish gate
        run: bun test ./cli-publish-gate.test.ts ./cla-workflow.test.ts ./public-contribution-workflows.test.ts
        working-directory: .github

      - name: Validate subprocess lane membership
        run: bun test ./subprocess-lane-gate.test.ts
        working-directory: .github

      - name: Validate PR rewind fork-point gate
        run: bun test ./pr-rewind-gate.test.ts
        working-directory: .github

      - name: Validate test lane aggregation
        run: bun test ./lane-gate.test.ts ./test-runner.test.ts ./test-completion-gate.test.ts ./core-test-plan.test.ts ./ci-notification-state.test.ts ./test-schema-cache.test.ts
        working-directory: .github

      - name: Validate typecheck diagnostics evidence gate
        run: bun test ./typecheck-diagnostics-gate.test.ts
        working-directory: .github

      - name: Verify CI stability mutation proofs
        run: bun scripts/test-ci-stability-mutations.ts

      - name: Validate CI web test gate
        run: bun test ./ci-web-test-gate.test.ts
        working-directory: .github

      - name: Validate sterile secret-boundary gate
        run: bun test ./ci-secret-boundary-gate.test.ts
        working-directory: .github

      - name: Validate Pi patch gate
        run: bun test ./ci-pi-patch-gate.test.ts
        working-directory: .github

      - name: Validate sandbox executor CI gate
        run: bun test ./ci-sandbox-executor-gate.test.ts
        working-directory: .github

      - name: Validate CI typecheck gate
        run: bun test ./ci-typecheck-gate.test.ts
        working-directory: .github

      # Fails closed if .bun-version drifts from the bun-version every workflow
      # pins into oven-sh/setup-bun. The advertised developer/sandbox runtime
      # and the runtime CI validates must move together. Runs from .github so
      # ITS bunfig.toml applies (root preloads need the ParadeDB container).
      - name: Validate bun version pin
        run: bun test ./bun-version-gate.test.ts ./bun-extra-pipe-lifecycle.test.ts
        working-directory: .github

      # Pins core-artifact.yml's push-only channel-pointer guard, its
      # five-secret publish guard, tarball->sig->manifest upload order, and
      # the already-published head-object guard. Runs from .github so ITS
      # bunfig.toml applies (root preloads need the ParadeDB container).
      - name: Run sandbox executor tests
        run: bun run test
        working-directory: packages/k8s-sandbox

  test-typecheck:
    # Typecheck and the production builds. Its own lane because a type error aborts
    # the step it runs in: while typecheck shared a job with the suites, one bad
    # signature (#1389) suppressed EVERY test result on that PR.
    name: test / typecheck
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          # History is used by changed-path and Git-backed test fixtures.
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in lockstep with .bun-version (enforced by
          # .github/bun-version-gate.test.ts). Bun 1.3.11 segfaults loading this
          # repo's test graph (exit 133, main-thread trap) before any test runs
          # — the AMTP node-conformance suite (apps/core/src/services/amtp/
          # node-conformance-readiness.test.ts) is the canary. Validate any bump
          # against that suite before moving the pin.
          bun-version: 1.4.2

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Warning: Failed to save: <h2>Our services aren't available right now</h2><p>We're working to restore all services as soon as possible. Please check back soon.</p>0IwKiaQAAAADjh/+FNX7BTYMVk1Vx8z1mQ0hHRURHRTE3MTYARWRnZQ==
      # Cache Docker images
      # - name: Cache Docker images
      #   uses: ScribeMD/docker-cache@0.5.0
      #   with:
      #     key: docker-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      # Start PostgreSQL container (allows caching the image)
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Report typecheck memory context
        run: |
          grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree):' /proc/meminfo
          cgroup_context=false
          for file in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current; do
            if [[ -r "$file" ]]; then
              echo "$file=$(cat "$file")"
              cgroup_context=true
            fi
          done
          if [[ "$cgroup_context" == false ]]; then
            echo 'cgroup_memory_context=unavailable (memory.max/current not readable)'
          fi
          NODE_OPTIONS=--max-old-space-size=6144 node -e "const v8 = require('node:v8'); console.log('v8_heap_size_limit=' + v8.getHeapStatistics().heap_size_limit)"

      # Every package, not just @ficus/shared. `bun build` (used for the CLI and
      # for apps/core) transpiles without type-checking, so before this step the
      # only code CI ever type-checked was @ficus/shared — which is how main once
      # shipped a TS2677 error in apps/core that no test could catch. Each
      # package's typecheck is `tsc --noEmit`, so this builds nothing and the
      # step it replaced ("Build shared package") never built anything either.
      # The 16 GiB runners this measured on reported 16,169,252 kB of host
      # memory and an effective 6,492,782,592-byte V8 ceiling, leaving 9.37 GiB
      # outside it.
      # Bun runs dependency-independent workspace scripts concurrently, so the
      # Core-only variable avoids multiplying that ceiling across every tsc.
      - name: Typecheck all packages
        env:
          CORE_TYPECHECK_NODE_OPTIONS: --max-old-space-size=6144
        run: bun run typecheck

      - name: Build CLI
        run: bun run build:cli

      - name: Build core
        # Use the package's own build script so the externals it declares
        # (bun-pty, jsdom, playwright-core, …) match what a deployment builds —
        # an ad-hoc `bun build` here failed to resolve playwright-core's
        # internals once the host-runtime browser backend landed.
        run: bun run --filter core build

      # Tenant provisioning BUILDS THE WEB APP ON THE TENANT VM
      # (scripts/setup/setup-host.sh's build phase), so a broken web build is a
      # broken tenant — provisioning fails after the customer has paid. Nothing
      # here built apps/web, which is how a node builtin reaching the browser
      # bundle (`@ficus/shared` re-exporting ./crypto) shipped to main and blocked
      # every provision. Build it in CI so that class of break is caught here.
      - name: Build web
        run: bun run --filter web build

  # Dedicated runner for the real-subprocess flake family: these apps/core
  # test files spawn real bun subprocesses / real builds / full migration
  # runs. They have 8-25x local headroom but flake under CI scheduling
  # jitter when packed onto the shared `test` runner alongside everything
  # else, so they run here alone (only postgres beside them) and are
  # skipped in the main sweep via FICUS_TEST_SKIP_SUBPROCESS=1 (see the
  # `test` job's "Run tests" step). No `needs:` — runs in parallel with
  # `test`.

  test-core:
    # apps/core, the sterile secret-boundary suite, and the persistent-restart proof.
    # Needs Postgres.
    name: test / core
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          # History is used by changed-path and Git-backed test fixtures.
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in lockstep with .bun-version (enforced by
          # .github/bun-version-gate.test.ts). Bun 1.3.11 segfaults loading this
          # repo's test graph (exit 133, main-thread trap) before any test runs
          # — the AMTP node-conformance suite (apps/core/src/services/amtp/
          # node-conformance-readiness.test.ts) is the canary. Validate any bump
          # against that suite before moving the pin.
          bun-version: 1.4.2

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Warning: Failed to save: <h2>Our services aren't available right now</h2><p>We're working to restore all services as soon as possible. Please check back soon.</p>0IwKiaQAAAADjh/+FNX7BTYMVk1Vx8z1mQ0hHRURHRTE3MTYARWRnZQ==
      # Cache Docker images
      # - name: Cache Docker images
      #   uses: ScribeMD/docker-cache@0.5.0
      #   with:
      #     key: docker-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      # Start PostgreSQL container (allows caching the image)
      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name postgres-test \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=tau_test \
            -p 5433:5432 \
            --health-cmd "pg_isready -U postgres -d tau_test" \
            --health-interval 2s \
            --health-timeout 5s \
            --health-retries 10 \
            paradedb/paradedb:latest

      - name: Wait for PostgreSQL
        run: |
          for i in {1..60}; do
            if docker exec postgres-test pg_isready -U postgres -d tau_test && \
               PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d tau_test -c "SELECT 1;" >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/60)"
            docker ps --filter name=postgres-test
            sleep 2
          done
          echo "PostgreSQL failed to start"
          docker logs postgres-test
          exit 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create database extensions
        run: |
          for i in {1..10}; do
            if docker exec postgres-test psql -U postgres -d tau_test -c "CREATE EXTENSION IF NOT EXISTS vector;" && \
               docker exec postgres-test psql -U postgres -d tau_test -c "CREATE EXTENSION IF NOT EXISTS pg_search;"; then
              exit 0
            fi
            echo "Extension creation failed; retrying ($i/10)"
            docker logs --tail 100 postgres-test
            sleep 3
          done
          docker logs postgres-test
          exit 1

      # Pins the step below so it cannot be silently weakened — scoped back to
      # one package, made conditional, or marked continue-on-error. Runs from
      # .github so ITS bunfig.toml applies and the root preloads (which need
      # the ParadeDB container) are skipped.
      - name: Build CLI
        run: bun run build:cli

      - name: Run tests
        # The tee + summary gate exists because a test (or app code a test
        # loads) that calls process.exit(0) mid-suite kills bun with a SUCCESS
        # code before the remaining files run — observed 2026-08-27: a SIGTERM
        # emitted by the activity-repair CLI test hit worker.ts's then
        # module-level shutdown handler, the suite died at file ~176 of ~674,
        # and CI stayed green while ~500 files went unexecuted for two days.
        # bun prints its "Ran N tests across M files" summary ONLY when the run
        # actually completes, so requiring it (plus bun's own exit code, kept by
        # pipefail) turns any future early-exit into a red build.
        shell: bash
        run: |
          set -o pipefail
          # Sorted, explicit file list: bun's default discovery runs files in
          # readdir order, which differs per filesystem/host — cross-file state
          # leaks then fail DIFFERENT tests on every runner (the order
          # lottery). A deterministic order makes green reproducible and any
          # pollution failure bisectable.
          bun run test 2>&1 | tee /tmp/bun-test-core.log
          echo "--- summary gate"
          grep -E 'Ran [0-9]+ tests across [0-9]+ files' /tmp/bun-test-core.log || {
            echo '::error::bun test ended without its final summary line — the process exited early (see the log above for a mid-suite process.exit).'
            exit 1
          }
        working-directory: apps/core
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/tau_test
          FICUS_TEST_SKIP_SUBPROCESS: '1'

      - name: Create isolated sterile secret-boundary database
        run: |
          docker exec postgres-test psql -v ON_ERROR_STOP=1 -U postgres -c "CREATE DATABASE tau_secret_boundary_test;"
          docker exec postgres-test psql -v ON_ERROR_STOP=1 -U postgres -d tau_secret_boundary_test -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_search;"

      - name: Run sterile secret-boundary tests
        run: bash .github/run-secret-boundary-tests.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/tau_secret_boundary_test
          SECRET_BOUNDARY_REQUIRE_ISOLATED_DB: '1'

      - name: Run Core persistent restart test
        run: bun run test:core:fifo-restart

  test-web:
    # The full web gate and the DOM-order gate. Split from mobile deliberately: they
    # shared a job, and on 2026-09-04 the web gate's failure aborted the job before
    # the mobile suite ran at all, hiding a second break for hours.
    name: test / web
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
