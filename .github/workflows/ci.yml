  test:
    # The required check. It runs no tests itself: it fails unless every lane
    # succeeded, so splitting the suites did not quietly narrow what blocks a
    # merge. Branch protection keeps pointing at `test` and needs no change.
    #
    # `if: always()` so this still reports when a lane fails or is cancelled --
    # without it a failed lane would leave the required check pending forever.
    # The verdict lives in a script rather than inline bash so it is testable
    # (.github/lane-gate.test.ts), matching macos-portability-required.
    name: test
    needs: [test-gates, test-typecheck, test-core, test-web]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Require every test lane
        env:
          LANE_RESULTS: ${{ join(needs.*.result, ',') }}
          LANE_NAMES: test-gates,test-typecheck,test-core,test-web
        run: bun .github/lane-gate.ts verify-result

  subprocess-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          # cli-bundle.test.ts stamps real commit info from git, which needs
          # full history — see the `test` job's identical checkout step.
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in lockstep with .bun-version (enforced by
          # .github/bun-version-gate.test.ts) and the `test` job's pin.
          bun-version: 1.4.2

      # Same Node the `test` job pins. The AMTP node-conformance suite is this
      # repo's canary for the Node version (see that job's step comment), and it
      # runs in THIS lane — a lane hosting real-subprocess tests must supply the
      # same runtime the main job does, or moving a test here silently changes
      # what it runs against.
      #
      # Kept for that reason ALONE. It was added believing it explained a
      # subprocess-tests failure on this branch; the log later showed the
      # failure was `attemptPickup … restarts real worker incarnations`, a
      # pre-existing flake in this lane (3 failures / 60 main runs, two of them
      # that same test family). The pin did not fix that and does not claim to.
      # Cache downloaded packages only. Installed module trees are worktree/layout-specific.
      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Start PostgreSQL container (allows caching the image)
      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name postgres-test \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=tau_test \
            -p 5433:5432 \
            --health-cmd "pg_isready -U postgres -d tau_test" \
            --health-interval 2s \
            --health-timeout 5s \
            --health-retries 10 \
            paradedb/paradedb:latest

      - name: Wait for PostgreSQL
        run: |
          for i in {1..60}; do
            if docker exec postgres-test pg_isready -U postgres -d tau_test && \
               PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d tau_test -c "SELECT 1;" >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/60)"
            docker ps --filter name=postgres-test
            sleep 2
          done
          echo "PostgreSQL failed to start"
          docker logs postgres-test
          exit 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create database extensions
        run: |
          for i in {1..10}; do
            if docker exec postgres-test psql -U postgres -d tau_test -c "CREATE EXTENSION IF NOT EXISTS vector;" && \
               docker exec postgres-test psql -U postgres -d tau_test -c "CREATE EXTENSION IF NOT EXISTS pg_search;"; then
              exit 0
            fi
            echo "Extension creation failed; retrying ($i/10)"
            docker logs --tail 100 postgres-test
            sleep 3
          done
          docker logs postgres-test
          exit 1

      # Membership is enforced by .github/subprocess-lane-gate.test.ts — a test
      # file that spawns a real bun subprocess must be listed here. Adding one
      # to apps/core without adding it here fails that gate, which is what
      # stops the silent drift back into the contended `test` job.
      - name: Run real-subprocess tests
