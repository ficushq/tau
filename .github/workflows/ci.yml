          src/services/work-streams/worktree-cleanup-runtime.test.ts
          src/services/work-streams/worktree-cleanup-attachments.test.ts
          src/services/work-streams/worktree-cleanup-reconciler.test.ts
          src/services/integrations/outputs/runtime.test.ts
          src/services/execution/pickup.test.ts
          src/services/machines/cli-bundle.test.ts
          src/db/model-tiers-migration.test.ts
          src/db/migrate-bundle.test.ts
          src/db/load-root-env.test.ts
          src/tools/k8s-sandbox.real-edit.test.ts
          src/index.test.ts
          src/worker.test.ts
          src/lib/paths.test.ts
          src/lib/utils/cli-help.test.ts
          src/routes/deployments.integration.test.ts
          src/services/amtp/node-conformance-registration.test.ts
          src/services/amtp/node-conformance-attachment-upload.test.ts
          src/services/amtp/node-conformance-cli.test.ts
          src/services/amtp/node-conformance-process.test.ts
          src/services/amtp/node-conformance-whoami.test.ts
          src/services/amtp/node-conformance.test.ts
          src/services/integrations/notion/cli.e2e.test.ts
          src/services/integrations/notion/core-lifecycle.e2e.test.ts
          src/test-utils/captured-process.test.ts
          src/services/machines/artifact-extension-smoke.test.ts
          src/services/model-selection/openai-compatible.test.ts
          src/services/sandbox/k8s/constants.test.ts
          src/services/sandbox/k8s/kubeconfig.test.ts
          src/services/secrets/store-hermetic.test.ts
          src/boot/legacy-env.test.ts
        working-directory: apps/core
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/tau_test

  # End-to-end proof that `bun run setup` produces a running, self-updatable
  # local install (docs/history/superpowers/specs/2026-09-02-local-setup-installer-design.md §9).
  local-setup:
    runs-on: ubuntu-24.04
    # Two full installs (the second instance has its own checkout, install and
    # build) plus an in-app update apply.
    timeout-minutes: 40
    # Checkout/offline update use the repository-scoped Actions token. The
    # in-app updater reads an encrypted integration fixture seeded after setup;
    # native service units do not inherit credentials from this job environment.
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history is needed to exercise a real fast-forward update.
          fetch-depth: 0
          # The in-app updater fetches with its own bearer extraheader; a persisted
          # checkout credential would make git send two Authorization headers (400).
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in lockstep with .bun-version (enforced by
          # .github/bun-version-gate.test.ts) and the `test`/`subprocess-tests` pin.
          bun-version: 1.4.2

      # Cache downloaded packages only. Installed module trees are worktree/layout-specific.
      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Start PostgreSQL container (allows caching the image)
      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name postgres-test \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=tau_test \
            -p 5433:5432 \
            --health-cmd "pg_isready -U postgres -d tau_test" \
            --health-interval 2s \
            --health-timeout 5s \
            --health-retries 10 \
            paradedb/paradedb:latest

      - name: Wait for PostgreSQL
        run: |
          for i in {1..60}; do
            if docker exec postgres-test pg_isready -U postgres -d tau_test && \
               PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d tau_test -c "SELECT 1;" >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/60)"
            docker ps --filter name=postgres-test
            sleep 2
          done
          echo "PostgreSQL failed to start"
          docker logs postgres-test
          exit 1

      - name: Create database extensions
        run: |
          for i in {1..10}; do
            if docker exec postgres-test psql -U postgres -d tau_test -c "CREATE EXTENSION IF NOT EXISTS vector;" && \
               docker exec postgres-test psql -U postgres -d tau_test -c "CREATE EXTENSION IF NOT EXISTS pg_search;"; then
              exit 0
            fi
            echo "Extension creation failed; retrying ($i/10)"
            docker logs --tail 100 postgres-test
            sleep 3
          done
          docker logs postgres-test
          exit 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure git credentials via gh
        # persist-credentials is off above; plain git (the offline update's
        # `git fetch`) uses the job credential through gh's helper, which
        # serves GH_TOKEN (job env) without adding a second header.
        run: gh auth setup-git

      # Unit-level coverage for the setup toolkit itself, run once here rather
      # than as part of the full apps/cli suite (which has known
      # order-dependent failures unrelated to this work) — this is exactly the
      # slice of files the steps below exercise end-to-end.
      - name: Run local-setup unit suites
        shell: bash
        # The root-level `bun test` loads apps/core's preload, which spins up a
        # docker compose test database unless DATABASE_URL already points at a
        # reachable `tau_test` — the Postgres service above is exactly that.
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/tau_test
        run: |
          (cd apps/cli && bun test src/local-server src/commands/server.test.ts src/commands/update.test.ts src/docs-links.test.ts)
          bun test scripts/setup.test.ts scripts/pm2-name.test.ts
          bun test ./.github/local-setup-integration.test.ts

      - name: Dry run (docker-socket) changes nothing
        run: |
          bun run setup -- --dry-run --runtime docker-socket --yes
          test ! -f .env
          test ! -f ecosystem.config.js

      # Non-default port (3100): proves the .env PORT is honoured by the
      # recorded supervisor, not just a value matching a process default.
      - name: Create a fresh database for setup
        # The unit-suite step's core preload pushes the schema into tau_test
        # (drizzle push, no migrations table), so `db:migrate` there fails with
        # "type already exists". Setup gets its own empty database.
        run: |
          docker exec postgres-test psql -U postgres -c "CREATE DATABASE tau_local_setup;"
          docker exec postgres-test psql -U postgres -d tau_local_setup -c "CREATE EXTENSION IF NOT EXISTS vector;"
          docker exec postgres-test psql -U postgres -d tau_local_setup -c "CREATE EXTENSION IF NOT EXISTS pg_search;"

      - name: Setup (host runtime) against the CI database
        shell: bash
        run: |
          bun run setup -- --runtime host --database-url postgres://postgres:postgres@localhost:5433/tau_local_setup --port 3100 --yes 2>&1 | tee /tmp/setup.log
          grep -q 'Tau is running at http://localhost:3100' /tmp/setup.log
          grep -q 'FICUS_SANDBOX_RUNTIME=host' .env
          grep -Eq '^FICUS_ENCRYPTION_KEY=[0-9a-f]{64}$' .env

      # Exercise authenticated updates using a disposable integration connection
      # with the job token; interactive user
      # OAuth is covered separately. Never restore host gh-auth fallback here.
      - name: Seed GitHub integration for the in-app updater
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/tau_local_setup
        run: bun apps/core/src/scripts/seed-local-setup-github.ts

      - name: Health, status, and API-native updater support
        shell: bash
        run: |
          # /health is the core's public liveness route and answers 200 here.
          # 401 is still accepted: a reverse proxy in front of an instance may
          # gate it, and a rejection can only come from something answering.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/health || true)
          [ "$code" = 200 ] || [ "$code" = 401 ] || { echo "health=$code"; exit 1; }

          bun apps/cli/src/index.ts server status --json | tee /tmp/status.json
          node -e "const s=require('/tmp/status.json'); if (s.health!=='ok' || s.supervisor!=='systemd-user') { console.error(JSON.stringify(s)); process.exit(1) } for (const n of ['tau-api','tau-worker']) if (!s.processes.find(p=>p.name===n&&p.status==='online')) { console.error('not online: '+n); process.exit(1) }"

          PW=$(grep '^FICUS_PASSWORD=' .env | cut -d= -f2-)

          # Point the in-app updater at the exact code under test. On
          # pull_request runs the tree is the PR merge commit; targeting
          # configured 'main' makes apply either no-op with a misleading sha
          # or fail --ff-only when main advanced (the same flake hits a
          # workflow_dispatch run from a diverged feature branch). Rewind to
          # the merge base first, so apply is a REAL fast-forward whose diff is
          # this change's own files and whose end state is the code under test.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Rewind to this branch's FORK POINT -- the merge-base of the merge
            # commit's two parents -- not `merge-base HEAD base.sha`. On a
            # pull_request event HEAD is the merge commit and base.sha IS its
            # first parent, so that form returns base.sha itself: main's tip.
            # The moment main advances past the fork, applying the PR head from
            # main's tip is not a fast-forward, the updater correctly reports
            # `skipped` with changedFiles: [], and the afterSha assertion below
            # fails a PR that is perfectly healthy. Observed on #1421 (twice)
            # and #1414, each time cleared only by a branch update.
            git checkout --quiet --detach "$(git merge-base HEAD^1 HEAD^2)"
            # Assert the precondition here, where it is one line of output, rather
            # than letting it surface 600s later as an unexplained `skipped` with
            # an empty changedFiles array. --is-ancestor returns 1 for "no" and
            # >1 for a real error; both are fatal here, so one branch covers both.
            if ! git merge-base --is-ancestor HEAD '${{ github.event.pull_request.head.sha }}'; then
              echo "::error::rewind target $(git rev-parse HEAD) is not an ancestor of PR head ${{ github.event.pull_request.head.sha }} — the apply below cannot fast-forward"
              exit 1
            fi
            curl -sS -o /tmp/patch-settings.json -w 'patch-settings HTTP %{http_code}\n' -X PATCH \
              -H "Authorization: Bearer $PW" -H 'Content-Type: application/json' \
              -d '{"branch":"${{ github.event.pull_request.head.sha }}"}' \
              http://localhost:3100/api/updates/settings
            grep -q '"branch":"${{ github.event.pull_request.head.sha }}"' /tmp/patch-settings.json
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Same idea for manually dispatched runs: rewind to the merge base
            # with main and target the dispatched sha (the pushed branch head).
            git checkout --quiet --detach "$(git merge-base HEAD origin/main)"
            curl -sS -o /tmp/patch-settings.json -w 'patch-settings HTTP %{http_code}\n' -X PATCH \
              -H "Authorization: Bearer $PW" -H 'Content-Type: application/json' \
              -d "{\"branch\":\"$GITHUB_SHA\"}" http://localhost:3100/api/updates/settings
            grep -q "\"branch\":\"$GITHUB_SHA\"" /tmp/patch-settings.json
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            # Detached test-merge sha resolves in-repo; a clean 'already up to
            # date' beats racing main. (Merge-group runs do not rewind.)
            curl -sS -o /dev/null -X PATCH -H "Authorization: Bearer $PW" -H 'Content-Type: application/json' \
              -d "{\"branch\":\"$GITHUB_SHA\"}" http://localhost:3100/api/updates/settings
          fi
          # push runs (trusted main): untouched — settings stay on the configured branch.

          # Bootstrap bearer holds updates:* until the first admin exists. If
          # the route rejects it, fall back to the CLI form (same assertions).
          CHECK_STATUS=$(curl -s -o /tmp/check.json -w '%{http_code}' -X POST -H "Authorization: Bearer $PW" http://localhost:3100/api/updates/check)
          echo "check HTTP $CHECK_STATUS:"; cat /tmp/check.json
          if [ "$CHECK_STATUS" -lt 200 ] || [ "$CHECK_STATUS" -ge 300 ]; then
            echo "curl /api/updates/check rejected the bootstrap bearer — falling back to the CLI"
            FICUS_PASSWORD="$PW" bun apps/cli/src/index.ts update check --json | tee /tmp/check.json
          fi
          node -e "const r=require('/tmp/check.json'); if (r.supported!==true || r.flavor.supervisor!=='systemd-user' || r.flavor.source!=='git-checkout') { console.error(JSON.stringify(r)); process.exit(1) }"

          APPLY_STATUS=$(curl -s -o /tmp/apply.json -w '%{http_code}' -X POST -H "Authorization: Bearer $PW" http://localhost:3100/api/updates/apply)
          echo "apply HTTP $APPLY_STATUS:"; cat /tmp/apply.json
          if [ "$APPLY_STATUS" -lt 200 ] || [ "$APPLY_STATUS" -ge 300 ]; then
            echo "curl /api/updates/apply rejected the bootstrap bearer — falling back to the CLI"
            FICUS_PASSWORD="$PW" bun apps/cli/src/index.ts update apply --json | tee /tmp/apply.json
          fi

          # /api/updates/apply returns the run the instant the background job
          # starts (commands: [] at that point, and this run is un-awaited) —
          # poll /api/updates/status until it actually settles instead of
          # trusting that snapshot, and only then trust its commands array.
          #
          # On pull_request/merge_group runs the plan is real work (PR diff vs
          # main -> build:cli, build:core, then reload:worker, reload:api) and
          # reload:api restarts the very process this poll is talking to — so
          # mid-poll the connection WILL drop. `|| true` keeps a transport
          # failure from aborting the assignment under -o pipefail; 000/empty/
          # any 5xx just means "not settled yet, probably mid-restart" and the
          # loop keeps going. Only 401/403/404 (a real auth/routing problem,
          # not a restart) is fatal.
          SETTLED=0
          for i in $(seq 1 300); do
            POLL_STATUS=$(curl -s -o /tmp/update-status.json -w '%{http_code}' -H "Authorization: Bearer $PW" http://localhost:3100/api/updates/status || true)
            case "$POLL_STATUS" in
              401|403|404)
                echo "status check HTTP $POLL_STATUS (fatal):"; cat /tmp/update-status.json
                exit 1
                ;;
              200)
                if node -e "
                  const s = require('/tmp/update-status.json');
                  process.exit(s.active === false && s.latest && ['succeeded', 'failed', 'skipped'].includes(s.latest.status) ? 0 : 1);
                "; then
                  SETTLED=1
                fi
                ;;
              *)
                echo "status check HTTP ${POLL_STATUS:-000} — not settled yet (likely mid-restart); retrying"
                ;;
            esac
            [ "$SETTLED" = "1" ] && break
            sleep 2
          done
          if [ "$SETTLED" != "1" ]; then
            echo "update apply did not settle within 600s:"; cat /tmp/update-status.json
            exit 1
          fi
          cat /tmp/update-status.json
          node -e "
            const s = require('/tmp/update-status.json');
            const failedCommand = (s.latest.commands || []).some((c) => c.status === 'failed');
            if (s.latest.status === 'failed' || failedCommand) { console.error(JSON.stringify(s.latest)); process.exit(1); }
          "
          # On PR runs the apply must have landed the PR HEAD specifically —
          # not main's tip, and not a no-op against the merge commit. A
          # manually dispatched run must land the dispatched sha.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node -e "
              const s = require('/tmp/update-status.json');
              if (s.latest.status !== 'succeeded' || s.latest.afterSha !== '${{ github.event.pull_request.head.sha }}') {
                console.error('apply did not land the PR head: ' + JSON.stringify(s.latest)); process.exit(1);
              }
            "
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node -e "
              const s = require('/tmp/update-status.json');
              if (s.latest.status !== 'succeeded' || s.latest.afterSha !== '$GITHUB_SHA') {
                console.error('apply did not land the dispatched sha: ' + JSON.stringify(s.latest)); process.exit(1);
              }
            "
          fi

      # An instance is a CHECKOUT: .env and ecosystem.config.js belong to one
      # label, and setup refuses to relabel a checkout that already carries
      # another (FICUS_INSTANCE=tau is in the .env the step above wrote). So the
      # second instance gets its own clone. --shared points the clone at the
      # workspace's object store, and --no-checkout + an explicit detach is the
      # only order that works for every event: on pull_request the commit under
      # test is reachable from HEAD alone, so a plain clone would check out
      # nothing.
      - name: Second checkout and database for instance ci2
        shell: bash
        run: |
          docker exec postgres-test psql -U postgres -c "CREATE DATABASE tau_local_setup2;"
          docker exec postgres-test psql -U postgres -d tau_local_setup2 -c "CREATE EXTENSION IF NOT EXISTS vector;"
          docker exec postgres-test psql -U postgres -d tau_local_setup2 -c "CREATE EXTENSION IF NOT EXISTS pg_search;"
          git clone --shared --no-checkout "$GITHUB_WORKSPACE" /tmp/tau-ci2
          # The event's sha, not the workspace HEAD: on pull_request runs the
          # health step rewound the workspace to the merge base so the updater
          # apply is a real fast-forward, and ci2 must still test the PR head.
          git -C /tmp/tau-ci2 checkout --detach "$GITHUB_SHA"

      # Every per-instance name follows the label: tau-ci2-api /
      # tau-ci2-worker, PORT 3300 (worker 3302, events 3303), HOME_DIR
      # ~/.tau-ci2. The database is passed in, so this instance manages no
      # container of its own — postgres-test above is CI's.
      - name: Setup the second instance (ci2)
        shell: bash
        working-directory: /tmp/tau-ci2
        run: |
          bun install --frozen-lockfile
          bun run setup -- --instance ci2 --runtime host --port 3300 --database-url postgres://postgres:postgres@localhost:5433/tau_local_setup2 --yes 2>&1 | tee /tmp/setup-ci2.log
          grep -q 'Tau is running at http://localhost:3300' /tmp/setup-ci2.log

      - name: Two instances coexist
        shell: bash
        run: |
          bun apps/cli/src/index.ts server list --json | tee /tmp/list.json
          # Both instances registered, and each one's own supervisor pair is
          # online: names derive from the label, proving that a second instance
          # did not take over the first one's services.
          node -e "
            const list = require('/tmp/list.json');
            const byLabel = Object.fromEntries(list.instances.map((i) => [i.label, i]));
            for (const [label, api, worker] of [
              ['tau', 'tau-api', 'tau-worker'],
              ['ci2', 'tau-ci2-api', 'tau-ci2-worker'],
            ]) {
              const instance = byLabel[label];
              if (!instance) { console.error('instance missing from list: ' + label); process.exit(1); }
              for (const name of [api, worker]) {
                const p = instance.processes.find((x) => x.name === name);
                if (!p || p.status !== 'online') { console.error(label + ': ' + name + ' is ' + (p ? p.status : 'not registered')); process.exit(1); }
              }
            }
          "

          # Both APIs answer (200, or 401 behind a gate — see the health step above).
          for port in 3100 3300; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$port/health" || true)
            [ "$code" = 200 ] || [ "$code" = 401 ] || { echo "health($port)=$code"; exit 1; }
          done

          # --instance resolves to the second checkout from inside the first one.
          bun apps/cli/src/index.ts server status --instance ci2 --json | tee /tmp/status-ci2.json
          node -e "
            const s = require('/tmp/status-ci2.json');
            if (s.instance !== 'ci2' || s.port !== 3300) { console.error('--instance ci2 resolved elsewhere: ' + JSON.stringify(s)); process.exit(1); }
            if (s.health !== 'ok') { console.error('ci2 health: ' + s.health); process.exit(1); }
          "
          bun apps/cli/src/index.ts server stop --instance ci2

      - name: Offline update path and shutdown
        shell: bash
        run: |
          bun apps/cli/src/index.ts server status --instance tau --json | tee /tmp/status-before-offline.json
          # PR/merge-group checkouts are detached HEAD; --ref pins the offline
          # updater to the exact commit under test instead of trying (and
          # failing) to resolve a branch to fast-forward.
          bun apps/cli/src/index.ts update apply --offline --ref "$(git rev-parse HEAD)" 2>&1 | tee /tmp/offline.log
          grep -q 'Already at' /tmp/offline.log
          bun apps/cli/src/index.ts server status --instance tau --json | tee /tmp/status-after-offline.json
          node -e "
            const before = require('/tmp/status-before-offline.json');
            const after = require('/tmp/status-after-offline.json');
            for (const name of ['tau-api', 'tau-worker']) {
              const b = before.processes.find((p) => p.name === name);
              const a = after.processes.find((p) => p.name === name);
              if (!b || !a) { console.error('process not found in status: ' + name); process.exit(1); }
              if (b.pid === a.pid) { console.error(name + ' pid unchanged across offline apply (recorded supervisor did not restart it): ' + b.pid); process.exit(1); }
            }
          "
          bun apps/cli/src/index.ts server stop --instance tau
          bun apps/cli/src/index.ts server status --instance tau --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const s=JSON.parse(d); if (s.health!=='unreachable') { console.error('expected unreachable, got: '+s.health); process.exit(1) }})"

      - name: Show logs on failure
        if: failure()
        run: |
          bun apps/cli/src/index.ts server logs --instance tau --lines 200 || true
          bun apps/cli/src/index.ts server logs --instance ci2 --lines 200 || true
          systemctl --user status tau-api.service tau-worker.service tau-ci2-api.service tau-ci2-worker.service --no-pager || true
          tail -n 200 ~/.tau/logs/tau-api.log ~/.tau/logs/tau-worker.log ~/.tau/logs/tau-ci2-api.log ~/.tau/logs/tau-ci2-worker.log 2>/dev/null || true

  # Manual-only incident evidence. All three revisions run sequentially on the
  # same worker image with a clean dependency install and the production heap
  # ceiling, so their TypeScript diagnostics are directly comparable.
  # Manual only, and deliberately so: this measures Core typecheck memory across
  # revisions and is far too expensive for normal PR CI.
  #
  # A SKIPPED RUN OF THIS JOB IS NOT EVIDENCE. On pull_request the `if` below
  # is false, GitHub reports conclusion "skipped", and a skipped check renders
  # alongside the passing ones — so the colour says nothing about whether a
  # comparison ever ran. The job NAME carries that, and the step summary below
  # names the exact SHA and artifact, because authoritative evidence is artifact
  # contents plus the job's execution state, never the check colour
  # (docs/history/design/ci-stability-and-flake-eradication.md, D2).
  core-typecheck-diagnostics:
    name: core-typecheck-diagnostics (manual only; a skipped run is not evidence)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Measure Core typecheck revisions
        shell: bash
        run: |
          cp .github/core-typecheck-diagnostics.sh "$RUNNER_TEMP/core-typecheck-diagnostics.sh"
          bash "$RUNNER_TEMP/core-typecheck-diagnostics.sh"
      - name: Upload Core typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-typecheck-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/core-typecheck-*.log
          if-no-files-found: error
      # Reached only when the job actually ran, so its presence in the summary
      # is itself the execution evidence a skipped check cannot fake.
      - name: Record what this run measured
        if: always()
        shell: bash
        run: |
          {
            echo "### Core typecheck diagnostics"
            echo
            echo "Executed on \`${GITHUB_SHA}\` (run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT})."
            echo "Artifact: \`core-typecheck-diagnostics-${GITHUB_SHA}\`."
            echo
            echo "A skipped run of this job produces no summary and no artifact."
          } >> "$GITHUB_STEP_SUMMARY"
